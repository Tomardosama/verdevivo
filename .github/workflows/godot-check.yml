name: Godot validation

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]

jobs:
  import-and-startup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Godot 4.7
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.7-stable/Godot_v4.7-stable_linux.x86_64.zip
          unzip -q Godot_v4.7-stable_linux.x86_64.zip
          chmod +x Godot_v4.7-stable_linux.x86_64
          sudo mv Godot_v4.7-stable_linux.x86_64 /usr/local/bin/godot

      - name: Import project and parse scripts
        run: godot --headless --editor --path . --quit

      - name: Run project startup smoke test
        run: godot --headless --path . --quit-after 5
